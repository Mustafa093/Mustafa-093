<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>مغامرة الأرقام - تعلم العد والزوجي والفردي</title>
<meta name="description" content="تطبيق تعليمي تفاعلي لأطفال الصف الأول لتعلم العد التصاعدي والتنازلي والأعداد الزوجية والفردية" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="app-header">
  <button id="homeBtn" class="icon-btn" title="القائمة الرئيسية" aria-label="القائمة الرئيسية" hidden>🏠</button>
  <div class="stars-badge" title="نجومي">
    <span class="star-icon">⭐</span>
    <span id="starCount">0</span>
  </div>
  <button id="muteBtn" class="icon-btn" title="كتم الصوت" aria-label="كتم الصوت">🔊</button>
</header>

<main id="view" class="view"></main>

<div id="mascot" class="mascot" hidden>
  <div class="mascot-bubble" id="mascotBubble"></div>
  <div class="mascot-emoji">🦉</div>
</div>

<div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>

<script src="app.js" defer></script>
</body>
</html>
